services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: netquest-backend
    environment:
      CHALLENGES_DIR: /challenges
    volumes:
      # Mounted read-only so a new challenge file appears after a restart,
      # with no image rebuild.
      - ./challenges:/challenges:ro
    ports:
      - '8000:8000'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: netquest-frontend
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Not started by default. The MVP keeps everything in the browser; this is
  # here for contributors building accounts or shared topologies.
  #   docker compose --profile db up --build
  postgres:
    image: postgres:18-alpine
    profiles: ['db']
    environment:
      POSTGRES_USER: netquest
      POSTGRES_PASSWORD: netquest
      POSTGRES_DB: netquest
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netquest']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
