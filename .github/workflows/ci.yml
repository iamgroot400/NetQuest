name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Engine and API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend:
    name: Typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` typechecks before bundling, so this covers both.
      - run: npm run build

  docker:
    name: docker compose up --build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Wait for the stack to come up
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "healthy after ${i}s" && exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: The app is served and the API answers through the proxy
        run: |
          curl -sf http://localhost:3000/ > /dev/null
          test "$(curl -sf http://localhost:3000/api/v1/challenges | jq 'length')" -ge 10
      - if: always()
        run: docker compose down -v
